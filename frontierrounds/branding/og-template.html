<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Frontier Rounds — OG cover template (1200x630).
  Render at 2x with headless Chrome, then downscale to 1200x630:
    chrome --headless --force-device-scale-factor=2 --window-size=1200,630 \
           --screenshot=out.png "file:///.../og-template.html"
  Required local files next to this template when rendering:
    _icon.png       full tile icon (512px+, derive-site-icons.mjs writes og/_icon.png)
    _wordmark.png   wordmark transparent png
  Font sources: point @font-face src to local copies of the site fonts
  (Instrument Serif + Work Sans woff2 from .next/static/media).
-->
<style>
  @font-face {
    font-family: "Instrument Serif";
    src: url("file:///E:/clients/frontierrounds/branding/InstrumentSerif-Latin.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Work Sans";
    src: url("file:///E:/自有部署项目/frontierrounds/.next/static/media/7ddd198311ba7843-s.p.3kq6k02b2ysv1.woff2") format("woff2");
    font-weight: 400;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F3EFE6; font-family: "Instrument Serif", Georgia, serif; }
  .page { position: relative; width: 1200px; height: 630px; padding: 64px 72px; }
  .page::after { content: ""; position: absolute; inset: 28px; border: 1px solid rgba(20,20,18,.08); }
  .topline { display: flex; align-items: center; }
  .wordmark { height: 46px; }
  .rule { width: 56px; height: 1px; background: rgba(20,20,18,.3); }
  .url { font-family: "Work Sans", Arial, sans-serif; font-size: 15px; letter-spacing: .06em; color: rgba(20,20,18,.55); }
  .hero { margin-top: 120px; display: flex; align-items: center; gap: 56px; }
  .icon { width: 216px; height: 216px; }
  h1 { font-weight: 400; font-size: 66px; line-height: 1.02; color: #11110F; max-width: 640px; }
  .tagline { margin-top: 26px; font-family: "Work Sans", Arial, sans-serif; font-size: 17px; color: rgba(20,20,18,.6); max-width: 560px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="page">
    <div class="topline">
      <img class="wordmark" src="_wordmark.png" alt="Frontier Rounds">
      <div style="flex:1"></div>
      <span class="url">frontierrounds.com</span>
    </div>
    <div class="hero">
      <img class="icon" src="_icon.png" alt="">
      <div>
        <h1>The money behind frontier AI, one round at a time.</h1>
        <div class="tagline">Disclosed equity rounds for companies built on machine learning — with sources.</div>
      </div>
    </div>
  </div>
</body>
</html>
