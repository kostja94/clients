version: 2.0.0
skill: datus-glossary-article
project: datus.ai

evals:
  # ===== v1.0.0 原有 =====
  - id: forbidden-loads
    file: forbidden-loads.md
    type: compliance
    description: Agent must not read datus.md, blog/README.md, or keyword-cluster files during skill execution

  - id: golden-brief-lakehouse
    file: golden-brief-lakehouse.md
    type: output-shape
    description: Phase 0/1 output for lakehouse GlossaryTerm must match required Brief fields and Gate decisions

  - id: pilot-article-exists
    file: null
    type: artifact
    description: datus/blog/30-what-is-lakehouse.md exists with category Glossary and slug what-is-lakehouse

  # ===== v2.0.0 新增 =====
  - id: E04
    name: "连续 4 短段 → Presentation Fragmentation Fail ⭐v2.0.0"
    input: "Glossary draft with 4 consecutive paragraphs each ≤2 sentences"
    expected:
      health_check: "Presentation & Rhythm dimension ≤4/10"
      assert:
        - "fragmentation cluster detected (≥2 clusters → ❌)"
        - "Master Checklist item P2 triggered"
    severity: high

  - id: E05
    name: "列表轰炸（相邻 3 H2 各含列表无分析）→ Fail ⭐v2.0.0"
    input: "3 consecutive H2 sections each contain a bullet list with no analysis paragraph between"
    expected:
      health_check: "Presentation & Rhythm dimension ≤4/10"
      assert:
        - "list bombing detected (≥3 consecutive → ❌)"
        - "each list must have ≥2 sentences of analysis after per presentation-rhythm §3"
    severity: high

  - id: E06
    name: "衔接率 <50% → Fail ⭐v2.0.0"
    input: "Glossary draft with <5 out of 10 consecutive paragraph pairs having any transition device"
    expected:
      health_check: "Presentation & Rhythm dimension ≤4/10"
      assert:
        - "transition rate <50% flagged"
        - "must add transition words/sentence bridges/keyword repetition"
    severity: high

  - id: E07
    name: "无来源量化 claim → EEAT Fail ⭐v2.0.0"
    input: "GlossaryTerm draft claims 'Datus improves query accuracy by 200%' with no source"
    expected:
      health_check: "EEAT & Fact dimension ≤4/10"
      assert:
        - "G3 triggered"
        - "must add source or remove unsourced claim"
    severity: critical

  - id: E08
    name: "POC 客户未标非 GA → G5/G4 Fail ⭐v2.0.0"
    input: "Draft states 'LinkedIn uses Datus in production' without POC qualifier"
    expected:
      gate: "G5 FAIL — product capability exaggeration"
      assert:
        - "must add proof-of-concept qualifier per product-facts.md §3"
    severity: critical

  - id: E09
    name: "Datus 占比 >15% → D3 Fail ⭐v2.0.0"
    input: "GlossaryTerm draft: Datus mentioned in 25% of paragraphs"
    expected:
      gate_d: "D3 FAIL"
      assert:
        - "product ratio exceeds 15% cap"
        - "must trim Datus paragraphs or add non-Datus content"
    severity: high

  - id: E10
    name: "Cannibalization — 重写已发布 canonical → D1 Fail ⭐v2.0.0"
    input: "New draft redefines semantic layer with full §1 canonical section while what-is-semantic-layer is published"
    expected:
      gate_d: "D1 FAIL"
      assert:
        - "cannibalization detected per glossary-terms.md blog_status: published"
        - "must MERGE or write as spoke with ≤150 word recap + link"
    severity: critical

  - id: E11
    name: "跨篇开篇模式雷同 → CA1 Fail ⭐v2.0.0"
    input: "Batch of 3 glossary drafts all use Mode A 'An analyst asks...' hook"
    expected:
      cross_article: "CA1 FAIL"
      assert:
        - "≥3 articles share same hook pattern"
        - "must vary at least 1 article to Mode B or C"
    severity: high

  - id: E12
    name: "定义节 H2 后直接 blockquote → 裸 blockquote 碎片 ⭐v2.0.0"
    input: "GlossaryTerm §1 starts with H2 then immediately blockquote definition, no lead-in paragraph"
    expected:
      health_check: "Presentation & Rhythm dimension ≤7/10"
      assert:
        - "bare blockquote detected per presentation-rhythm §5.1"
        - "must add 2-4 sentence lead-in paragraph before blockquote"
    severity: medium

pass-criteria:
  gates: [G1-G7, D1-D4]
  min-weighted-score: 7.0
  article-types: [GlossaryTerm, GlossaryComparison]

references-sync:
  - glossary-terms.md
  - content-graph.md
  - product-facts.md
